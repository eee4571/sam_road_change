# ===== Dataset / model backbone =====
DATASET: 'cityscale'
NO_SAM: false
SAM_VERSION: vit_b
SAM_CKPT_PATH: '../../models/samroad/sam_vit_b_01ec64.pth'

# ===== Training size / speed / memory =====
PATCH_SIZE: 512
BATCH_SIZE: 16
DATA_WORKER_NUM: 1
TRAIN_EPOCHS: 10
BASE_LR: 0.001

# ===== Fine-tuning strategy =====
FREEZE_ENCODER: false
ENCODER_LR_FACTOR: 0.1
ENCODER_LORA: false
FOCAL_LOSS: false
USE_SAM_DECODER: false
NEW_DOMAIN_RATIO: 0.6
OLD_DOMAIN_NAMES: [old, default]

# ===== Radiometric augmentation: training RGB only =====
AUG_RADIOMETRIC: false
AUG_BRIGHTNESS_PROB: 0.8
AUG_BRIGHTNESS_RANGE: [0.85, 1.15]
AUG_CONTRAST_PROB: 0.8
AUG_CONTRAST_RANGE: [0.85, 1.2]
AUG_GAMMA_PROB: 0.5
AUG_GAMMA_RANGE: [0.85, 1.2]
AUG_CHANNEL_SCALE_PROB: 0.5
AUG_CHANNEL_SCALE_RANGE: [0.9, 1.1]
AUG_NOISE_PROB: 0.3
AUG_NOISE_SIGMA_RANGE: [2.0, 6.0]
AUG_BLUR_PROB: 0.15
AUG_SENSOR_STYLE: false
AUG_SENSOR_COLOR_PROB: 0.8
AUG_SENSOR_CHANNEL_RANGE: [0.75, 1.25]
AUG_SENSOR_SATURATION_PROB: 0.7
AUG_SENSOR_SATURATION_RANGE: [0.55, 1.35]
AUG_SENSOR_BLUR_PROB: 0.25
AUG_SENSOR_NOISE_PROB: 0.35

# ===== Resolution augmentation: training RGB only =====
AUG_RESOLUTION: false
AUG_RESOLUTION_PROB: 0.6
AUG_RESOLUTION_BASE_GSD: 0.5
AUG_RESOLUTION_TARGET_GSD_RANGE: [0.5, 1.0]

# ===== Inference GSD / resolution handling =====
MODEL_GSD: 0.5
INFER_RESCALE_TO_MODEL_GSD: false
INFER_AUTO_GSD_FROM_GEOTIFF: true
INFER_INPUT_GSD: 0.5

# ===== Topology training / inference =====
TOPO_SAMPLE_NUM: 512
TOPONET_VERSION: normal
INFER_BATCH_SIZE: 16
SAMPLE_MARGIN: 64
INFER_PATCHES_PER_EDGE: 16

# ===== Inference thresholds =====
ITSC_THRESHOLD: 0.248
ROAD_THRESHOLD: 0.364
ROAD_HIGH_THRESHOLD: 0.364
ROAD_LOW_THRESHOLD: 0.20
ROAD_THRESHOLD_PROFILE: default
ROAD_THRESHOLD_PROFILES:
  default:
    ROAD_HIGH_THRESHOLD: 0.364
    ROAD_LOW_THRESHOLD: 0.20
TOPO_THRESHOLD: 0.5
TOPO_CANDIDATE_THRESHOLD: 0.2

# ===== Conservative weak-road recovery =====
WEAK_RECOVERY_ENABLED: true
WEAK_RECOVERY_MAX_GAP_PX: 64.0
WEAK_RECOVERY_MAX_EXTENSION_PX: 48.0
WEAK_RECOVERY_MIN_EXTENSION_PX: 10.0
WEAK_RECOVERY_MIN_DIRECTION_COSINE: 0.65
WEAK_RECOVERY_MAX_PATH_RATIO: 1.35
WEAK_RECOVERY_MIN_MEAN_PROBABILITY: 0.20
WEAK_RECOVERY_MIN_Q25_PROBABILITY: 0.17
WEAK_RECOVERY_MIN_WEAK_FRACTION: 0.80
WEAK_RECOVERY_MIN_BACKGROUND_CONTRAST: 0.08
WEAK_RECOVERY_BACKGROUND_OFFSET_PX: 4.0
WEAK_RECOVERY_PATH_MARGIN_PX: 16.0
WEAK_RECOVERY_SAMPLE_STEP_PX: 12.0
WEAK_RECOVERY_AUTO_SCORE: 0.62
WEAK_RECOVERY_SURFACE_THRESHOLD: 0.60
WEAK_RECOVERY_SURFACE_MIN_CENTER_PROBABILITY: 0.10
WEAK_RECOVERY_SURFACE_MIN_MEAN: 0.70
WEAK_RECOVERY_SURFACE_MIN_FRACTION: 0.80

# ===== Graph extraction pixel-radius parameters =====
ITSC_NMS_RADIUS: 8
ROAD_NMS_RADIUS: 16
ROAD_NMS_MIN_SEPARATION: 4.0
ROAD_TANGENT_RADIUS: 5.0
PARALLEL_BRANCH_COSINE: 0.9
PARALLEL_BRANCH_LATERAL_COSINE: 0.55
JUNCTION_POINT_MERGE_RADIUS: 4.0
JUNCTION_NODE_MODE: sparse
JUNCTION_SPARSE_RADIUS: 20.0
NEIGHBOR_RADIUS: 64
MAX_NEIGHBOR_QUERIES: 16
DEBUG_THRESHOLD_FALLBACK: true

# ===== Dataset build / label generation parameters =====
DATA_SAMPLE_STEP_PX: 4.0
KEYPOINT_SAMPLE_STEP_PX: 32.0
ROAD_WIDTH: 5
KEYPOINT_RADIUS: 5
MIN_ROAD_RATIO: 0.01
MIN_NODE_COUNT: 50

# ===== Tile split =====
ACTIVE_TILE_IDS: [0, 1]
TRAIN_TILE_IDS: [0]
VAL_TILE_IDS: [1]
TEST_TILE_IDS: []

# ===== Paths =====
DATA_ROOT: '../../data'
CITYSCALE_DIR: 'datasets/custom_cityscale/20cities'
PROCESSED_DIR: 'datasets/custom_cityscale/processed'
CITYSCALE_TILE_NUM: 2
